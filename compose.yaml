services:
  db:
    image: postgres:17
    container_name: odin-blog-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: odinblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: odinblog

    volumes:
      - odin_blog_postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api

    container_name: odin-blog-api
    restart: unless-stopped

    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: "postgresql://odinblog:${POSTGRES_PASSWORD}@db:5432/odinblog"
      CLIENT_URL: "http://localhost:8080"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES}
      COOKIE_SECURE: "false"

    ports:
      - "3001:3001"

    depends_on:
      - db
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /api

    container_name: odin-blog-web
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - api
volumes:
  odin_blog_postgres: